[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard"
version = "0.1.0"
description = "Discover AI agent fleets, score their risk, and publish the inventory to DataHub"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "AgentGuard" }]
keywords = ["ai-agents", "mcp", "datahub", "governance", "risk", "eu-ai-act"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "acryl-datahub>=0.14",
    "requests>=2.31",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/xAPT42/Agentguard-"
Repository = "https://github.com/xAPT42/Agentguard-"

[project.scripts]
agentguard = "agentguard.main:main"

[tool.setuptools.packages.find]
where = ["src"]
