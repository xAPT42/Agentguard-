services:
  mysql:
    image: mysql:8.0
    container_name: agentguard-mysql
    environment:
      MYSQL_DATABASE: datahub
      MYSQL_USER: datahub
      MYSQL_PASSWORD: datahub
      MYSQL_ROOT_PASSWORD: datahub
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-udatahub", "-pdatahub"]
      interval: 10s
      timeout: 5s
      retries: 12

  elasticsearch:
    image: elasticsearch:7.17.28
    container_name: agentguard-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  datahub-gms:
    image: acryldata/datahub-gms:head
    container_name: agentguard-datahub-gms
    ports:
      - "8080:8080"
    environment:
      - DATAHUB_SERVER_TYPE=quickstart
      - EBEAN_DATASOURCE_HOST=mysql:3306
      - EBEAN_DATASOURCE_URL=jdbc:mysql://mysql:3306/datahub?verifyServerCertificate=false&useSSL=true&useUnicode=yes&characterEncoding=UTF-8
      - EBEAN_DATASOURCE_USERNAME=datahub
      - EBEAN_DATASOURCE_PASSWORD=datahub
      - EBEAN_DATASOURCE_DRIVER=com.mysql.jdbc.Driver
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
      - GRAPH_SERVICE_IMPL=elasticsearch
      - ENTITY_REGISTRY_CONFIG_PATH=/datahub/datahub-gms/resources/entity-registry.yml
      - MAE_CONSUMER_ENABLED=true
      - MCE_CONSUMER_ENABLED=true
      - METADATA_SERVICE_AUTH_ENABLED=false
      - KAFKA_BOOTSTRAP_SERVER=
      - KAFKA_SCHEMAREGISTRY_URL=
    depends_on:
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

  datahub-frontend:
    image: acryldata/datahub-frontend-react:head
    container_name: agentguard-datahub-frontend
    ports:
      - "9002:9002"
    environment:
      - DATAHUB_GMS_HOST=datahub-gms
      - DATAHUB_GMS_PORT=8080
      - DATAHUB_SECRET=agentguard-local-secret
      - METADATA_SERVICE_AUTH_ENABLED=false
      - AUTH_JAAS_ENABLED=false
    depends_on:
      datahub-gms:
        condition: service_healthy

volumes:
  mysql-data:
  es-data:
